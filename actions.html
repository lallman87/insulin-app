<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carb Counting - Actions</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="d-flex align-items-center gap-2 justify-content-between">
      <h1 class="mb-0"><a href="index.html">Carb Counting</a></h1>
      <a href="index.html" class="btn home-btn"><i class="fas fa-home"></i></a>
    </div>

    <h4 class="mt-4 mb-0 fw-bold">Foods</h4>

    <div class="card mt-4">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="fs-6 fas fa-plus"></i>
        <h5 class="mb-0">Add Item</h5>
      </div>

      <div class="card-body">
        <div class="mb-3">
          <input type="text" id="itemName" class="form-control" placeholder="Item name">
        </div>

        <div class="mb-3">
          <input type="number" id="itemCarbs" class="form-control" placeholder="Carbs">
        </div>

        <div class="mb-3">
          <select id="itemCategory" class="form-select">
            <option value="">Select a category</option>
          </select>
        </div>

        <button id="insert" class="action-btn d-flex align-items-center gap-2"><i class="fas fa-save"></i><span>Add Item</span></button>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="fas fa-edit"></i>
        <h5 class="mb-0">Update Item</h5>
      </div>

      <div class="card-body">
        <div class="mb-3">
          <select id="updateId" class="form-select">
            <option value="">Select Item ID</option>
          </select>
        </div>

        <div class="mb-3">
          <input type="text" id="updateName" class="form-control" placeholder="New name">
        </div>

        <div class="mb-3">
          <input type="number" id="updateCarbs" class="form-control" placeholder="New carbs">
        </div>

        <div class="mb-3">
          <select id="updateCategory" class="form-select">
            <option value="">Select a category</option>
          </select>
        </div>

        <button id="update" class="action-btn d-flex align-items-center gap-2"><i class="fas fa-sync"></i><span>Update Item</span></button>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="fas fa-trash"></i>
        <h5 class="mb-0">Delete Item</h5>
      </div>

      <div class="card-body">
        <div class="mb-3">
          <select id="deleteId" class="form-select">
            <option value="">Select Item ID</option>
          </select>
        </div>

        <button id="delete" class="action-btn d-flex align-items-center gap-2"><i class="fas fa-trash"></i><span>Delete Item</span></button>
      </div>
    </div>

    <h4 class="mt-4 mb-0 fw-bold">Categories</h4>

    <div class="card mt-4">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="fs-6 fas fa-plus"></i>
        <h5 class="mb-0">Add Category</h5>
      </div>

      <div class="card-body">
        <div class="mb-3">
          <input type="text" id="newCategoryName" class="form-control" placeholder="New category name">
        </div>

        <button id="addCategory" class="action-btn d-flex align-items-center gap-2"><i class="fas fa-plus"></i><span>Add Category</span></button>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="fas fa-edit"></i>
        <h5 class="mb-0">Update Category</h5>
      </div>

      <div class="card-body">
        <div class="mb-3">
          <select id="updateCategoryId" class="form-select">
            <option value="">Select Category</option>
          </select>
        </div>

        <div class="mb-3">
          <input type="text" id="updateCategoryName" class="form-control" placeholder="New category name">
        </div>

        <button id="updateCategoryBtn" class="action-btn d-flex align-items-center gap-2"><i class="fas fa-sync"></i><span>Update Category</span></button>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="fas fa-trash"></i>
        <h5 class="mb-0">Delete Category</h5>
      </div>

      <div class="card-body">
        <div class="mb-3">
          <select id="deleteCategoryId" class="form-select">
            <option value="">Select Category</option>
          </select>
        </div>

        <button id="deleteCategoryBtn" class="action-btn d-flex align-items-center gap-2"><i class="fas fa-trash"></i><span>Delete Category</span></button>
      </div>
    </div>

    <pre id="output" class="bg-light p-3 mt-4 rounded"></pre>
  </div>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Supabase CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Main JS -->
  <script src="main.js"></script>
</body>
</html>
