<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carb Counting</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="d-flex align-items-center gap-2 justify-content-between">
        <h1 class="mb-0">Carb Counting</h1>
        <a href="actions.html" class="btn actions-btn"><i class="fas fa-plus"></i></a>
    </div>

    <div class="accordion mt-4" id="categoryAccordion"></div>

    <div class="d-flex gap-2 text-center align-items-center justify-content-center mt-4">
        <h4 class="mb-0">Total Carbs:</h4>
        <p id="totalCarbs" class="fs-5 mb-0">0</p>
    </div>

    <div class="d-flex gap-2 text-center align-items-center justify-content-center mb-4">
        <h4 class="mb-0">Insulin:</h4>
        <p id="totalInsulin" class="fs-5 mb-0">0</p>
    </div>

    <div class="d-flex gap-2">
        <button type="button" class="insulin-ratio-btn" data-value="5">5</button>
        <button type="button" class="insulin-ratio-btn active" data-value="7.5">7.5</button>
        <button type="button" class="insulin-ratio-btn" data-value="10">10</button>
    </div>

    <button type="button" id="reset" class="insulin-reset-btn">Reset</button>
  </div>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Supabase CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Main JS -->
  <script src="main.js"></script>
</body>
</html>
